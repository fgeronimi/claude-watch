<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Aperçu de claude-watch : la barre de menus affiche deux agents actifs et les quotas, le terminal affiche la status line et la commande status" xmlns:c2pa="http://c2pa.org/manifest">
