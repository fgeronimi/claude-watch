<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="Aperçu de claude-watch : dans la barre de menus, le nombre d'agents actifs et deux batteries 5H et 7J ; dans le terminal, la commande status et la status line" xmlns:c2pa="http://c2pa.org/manifest">
